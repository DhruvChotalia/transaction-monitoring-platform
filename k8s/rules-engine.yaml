apiVersion: apps/v1
kind: Deployment
metadata:
  name: rules-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rules-engine
  template:
    metadata:
      labels:
        app: rules-engine
    spec:
      containers:
        - name: rules-engine
          image: ghcr.io/dhruvchotaliadev/transaction-monitoring-platform/rules-engine:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rules-engine
spec:
  selector:
    app: rules-engine
  ports:
    - port: 8002
