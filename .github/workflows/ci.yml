name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check services/ tests/ simulation/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx scikit-learn numpy joblib
      - name: Train model (needed by ml-scorer tests)
        run: |
          pip install scikit-learn numpy joblib
          python services/ml-scorer/train.py
      - name: Run unit tests
        run: pytest tests/test_rules.py tests/test_ml_scorer.py -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build all service images
        run: docker compose build --parallel
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Copy env file
        run: cp .env.example .env
      - name: Train model
        run: |
          pip install scikit-learn numpy joblib
          python services/ml-scorer/train.py
      - name: Start services
        run: docker compose up -d --wait
        timeout-minutes: 5
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx
      - name: Run integration tests
        run: pytest tests/test_pipeline.py -v --timeout=30
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=50
      - name: Tear down
        if: always()
        run: docker compose down -v
